upstream siren_api { server monster-siren.hypergryph.com:443; }
upstream siren_media { server web.hycdn.cn:443; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Only expose the two read-only API shapes used by the music adapter.
    location ~ ^/music-api/(song/[0-9]+|album/[0-9]+/detail)$ {
        proxy_pass https://siren_api/api/$1;
        proxy_set_header Host monster-siren.hypergryph.com;
        proxy_ssl_server_name on;
        proxy_ssl_name monster-siren.hypergryph.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        add_header Cache-Control "no-store";
    }

    location /music-api/ { return 404; }

    location ~ "^/music-media(/siren/(?:pic|lyric)/[0-9]{8}/[a-f0-9]+\.(?:png|jpg|jpeg|webp|lrc))$" {
        proxy_pass https://siren_media$1;
        proxy_set_header Host web.hycdn.cn;
        proxy_set_header Referer "";
        proxy_set_header Origin "";
        proxy_ssl_server_name on;
        proxy_ssl_name web.hycdn.cn;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }
    location /music-media/ { return 404; }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
