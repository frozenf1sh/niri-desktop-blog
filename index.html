<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191722">
  <title>niri desktop</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./desktop.js"></script>
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-apps" viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <circle cx="5" cy="5" r="1.65"/><circle cx="12" cy="5" r="1.65"/><circle cx="19" cy="5" r="1.65"/>
      <circle cx="5" cy="12" r="1.65"/><circle cx="12" cy="12" r="1.65"/><circle cx="19" cy="12" r="1.65"/>
      <circle cx="5" cy="19" r="1.65"/><circle cx="12" cy="19" r="1.65"/><circle cx="19" cy="19" r="1.65"/>
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-folder-fill" viewBox="0 0 36 36" stroke="none">
      <path fill="currentColor" opacity=".65" d="M3.5 10A3.5 3.5 0 0 1 7 6.5h7l3.5 3.5H29a3.5 3.5 0 0 1 3.5 3.5v12A3.5 3.5 0 0 1 29 29H7a3.5 3.5 0 0 1-3.5-3.5Z"/>
      <path fill="currentColor" d="M6 13.5h24.5a3.5 3.5 0 0 1 3.44 4.16l-1.73 9A3.5 3.5 0 0 1 28.77 29H7.23a3.5 3.5 0 0 1-3.44-2.84l-1.23-8.5A3.5 3.5 0 0 1 6 13.5Z"/>
      <path stroke="#fff" opacity=".3" stroke-width="1.2" d="M7 14.5h23"/>
    </symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM9 20v-7h6v7"/></symbol>
    <symbol id="i-display" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8m-8 4h5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m3 17 5-5 4 4 3-3 6 6"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 17V6l11-3v12M9 10l11-3"/><ellipse cx="6" cy="17.5" rx="3" ry="2.5"/><ellipse cx="17" cy="15.5" rx="3" ry="2.5"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M20 14v-9a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7z"/><path d="M13 21v-5a2 2 0 0 1 2-2h5M8 8h8m-8 4h4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-14 4h1m3 0h1m3 0h1m-9 3h1m3 0h1"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M3 9a15 15 0 0 1 18 0M6 13a10 10 0 0 1 12 0m-9 4a5 5 0 0 1 6 0m-3 3h.01"/></symbol>
    <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="m3 3 18 18M3 9a15 15 0 0 1 3.3-1.85M10 6.1A15 15 0 0 1 21 9M6 13a10 10 0 0 1 4.1-1.7m5.3.3c.9.33 1.8.8 2.6 1.4m-9 4a5 5 0 0 1 6 0m-3 3h.01"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 10l4 4m0-4-4 4"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24"><rect x="2.5" y="7" width="17" height="10" rx="2.5"/><path d="M22 10v4"/><rect x="5" y="9.5" width="11.5" height="5" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-bluetooth" viewBox="0 0 24 24"><path d="m6 6 12 12-6 4V2l6 4L6 18"/></symbol>
    <symbol id="i-bell-off" viewBox="0 0 24 24"><path d="m3 3 18 18M9 18h11m-5-15a6 6 0 0 1 3 5v3m-9-7a6 6 0 0 0-3 5c0 4-1 6-3 9h3m4 3a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.8 15a9 9 0 0 1-11.7-11.7A9 9 0 1 0 20.8 15Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v4m11-5h4a1 1 0 0 1 1 1v4m0 6v4a1 1 0 0 1-1 1h-4m-6 0H5a1 1 0 0 1-1-1v-4"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4 9h4a1 1 0 0 0 1-1V4m6 0v4a1 1 0 0 0 1 1h4m0 6h-4a1 1 0 0 0-1 1v4m-6 0v-4a1 1 0 0 0-1-1H4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.8a1 1 0 0 1 1.5-.86l9.4 6.2a1 1 0 0 1 0 1.72l-9.4 6.2A1 1 0 0 1 8 18.2Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="7" y="5" width="3.5" height="14" rx="1"/><rect x="13.5" y="5" width="3.5" height="14" rx="1"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="5" y="5" width="2" height="14" rx="1"/><path d="m18 5-9 6.2a1 1 0 0 0 0 1.6L18 19a1 1 0 0 0 1.6-.8V5.8A1 1 0 0 0 18 5"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="17" y="5" width="2" height="14" rx="1"/><path d="m6 5 9 6.2a1 1 0 0 1 0 1.6L6 19a1 1 0 0 1-1.6-.8V5.8A1 1 0 0 1 6 5"/></symbol>
  </svg>

  <div class="wallpaper" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <header class="top-bar">
    <div class="bar-left">
      <button class="bar-button launch-button" id="launch-button" aria-label="应用程序" aria-controls="launcher" aria-expanded="false" title="应用程序">
        <svg class="icon" aria-hidden="true"><use href="#i-apps"/></svg>
      </button>
      <nav class="workspaces" aria-label="工作区">
        <button class="workspace-button" data-workspace="0" aria-label="工作区 1" aria-pressed="true" title="工作区 1"><span></span></button>
        <button class="workspace-button" data-workspace="1" aria-label="工作区 2" aria-pressed="false" title="工作区 2"><span></span></button>
        <button class="workspace-button" data-workspace="2" aria-label="工作区 3" aria-pressed="false" title="工作区 3"><span></span></button>
      </nav>
      <div class="active-app" id="active-app">
        <svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg><span>文件</span>
      </div>
    </div>
    <button class="bar-button clock-button" id="clock-button" title="日历" aria-label="打开日历">
      <time id="clock-time"></time><span class="clock-dot" aria-hidden="true"></span><span id="clock-date"></span>
    </button>
    <div class="bar-right">
      <button class="bar-button status-button" id="status-button" aria-label="控制中心" aria-controls="control-center" aria-expanded="false" title="控制中心">
        <svg class="icon dnd-status" id="status-dnd" aria-hidden="true" hidden><use href="#i-bell-off"/></svg>
        <svg class="icon" id="status-wifi" aria-hidden="true"><use href="#i-wifi"/></svg>
        <svg class="icon" id="status-volume" aria-hidden="true"><use href="#i-volume"/></svg>
        <span class="battery-status"><svg class="icon" aria-hidden="true"><use href="#i-battery"/></svg><span>86%</span></span>
        <svg class="icon status-chevron" aria-hidden="true"><use href="#i-chevron-down"/></svg>
      </button>
    </div>
  </header>

  <main class="desktop" aria-label="桌面">
    <div class="workspace-track" id="workspace-track">
      <section class="workspace" id="workspace-1" aria-label="工作区 1"><div class="tiles"></div></section>
      <section class="workspace" id="workspace-2" aria-label="工作区 2" inert><div class="tiles"></div></section>
      <section class="workspace" id="workspace-3" aria-label="工作区 3" inert><div class="tiles"></div></section>
    </div>
  </main>

  <section class="popover launcher" id="launcher" aria-label="应用程序" inert></section>
  <section class="popover control-center" id="control-center" aria-labelledby="control-title" inert>
    <div class="control-header">
      <h2 id="control-title">控制中心</h2>
      <span class="control-battery"><svg class="icon" aria-hidden="true"><use href="#i-battery"/></svg>86%</span>
    </div>
    <div class="quick-settings">
      <button class="quick-tile" data-toggle="wifi" aria-pressed="true">
        <span class="quick-icon"><svg class="icon" aria-hidden="true"><use href="#i-wifi"/></svg></span><span>无线网络</span>
      </button>
      <button class="quick-tile" data-toggle="bluetooth" aria-pressed="false">
        <span class="quick-icon"><svg class="icon" aria-hidden="true"><use href="#i-bluetooth"/></svg></span><span>蓝牙</span>
      </button>
      <button class="quick-tile" data-toggle="dnd" aria-pressed="false">
        <span class="quick-icon"><svg class="icon" aria-hidden="true"><use href="#i-bell-off"/></svg></span><span>勿扰</span>
      </button>
      <button class="quick-tile" data-toggle="night" aria-pressed="false">
        <span class="quick-icon"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg></span><span>夜间模式</span>
      </button>
    </div>
    <div class="sliders">
      <div class="slider-row">
        <button class="icon-button" id="mute-button" aria-label="静音" aria-pressed="false" title="静音"><svg class="icon" aria-hidden="true"><use href="#i-volume"/></svg></button>
        <input type="range" min="0" max="100" value="65" id="volume" aria-label="音量">
        <output for="volume" id="volume-value">65%</output>
      </div>
      <div class="slider-row">
        <span class="slider-icon"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg></span>
        <input type="range" min="20" max="100" value="100" id="brightness" aria-label="亮度">
        <output for="brightness" id="brightness-value">100%</output>
      </div>
    </div>
  </section>
</body>
</html>
